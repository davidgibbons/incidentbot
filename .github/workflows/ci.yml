name: CI

on:
  push:
    branches: [main]
    tags: ['[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]*']  # CalVer: YYYY.MM.DD
  pull_request:

permissions:
  contents: write        # needed to create GitHub Releases and tags
  pull-requests: write   # lets Codecov post coverage comments on PRs

jobs:
  # ── Lint ────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.5"

      - uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true

      - name: Cache venv
        uses: actions/cache@v5
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Lint
        run: make lint

  # ── Test ────────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: pytest
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # threading mode is more stable than multiprocessing on GitHub Actions
      BOLT_PYTHON_MOCK_SERVER_MODE: threading
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.5"

      - uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true

      - name: Cache venv
        uses: actions/cache@v5
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Run tests with coverage
        env:
          IS_TEST_ENVIRONMENT: "true"
          POSTGRES_DB: postgres
          POSTGRES_HOST: localhost
          POSTGRES_PASSWORD: pytest
          POSTGRES_PORT: "5432"
          POSTGRES_USER: postgres
        run: |
          poetry run pytest tests/ -q \
            --cov=incidentbot \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false   # don't fail CI if Codecov is unreachable
          # Add CODECOV_TOKEN to repository secrets for private repos or for
          # a more reliable upload on public repos:
          # token: ${{ secrets.CODECOV_TOKEN }}

  # ── Build & Push ─────────────────────────────────────────────────────────────
  # VEVO rebuilds use the upstream release version plus this workflow's build number.
  build-and-push:
    name: Build & Push
    needs: [lint, test]
    runs-on: vevo-ubuntu
    timeout-minutes: 45
    if: github.event_name == 'push' && github.repository == 'VEVO/incidentbot'
    env:
      UPSTREAM_VERSION: '2026.06.01'

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify upstream base and compute rebuild tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags https://github.com/incidentbot/incidentbot.git "refs/tags/${UPSTREAM_VERSION}:refs/tags/${UPSTREAM_VERSION}"
          git merge-base --is-ancestor "refs/tags/${UPSTREAM_VERSION}^{commit}" HEAD
          VERSION="${UPSTREAM_VERSION}-vevo.${GITHUB_RUN_NUMBER}"
          TAG="incidentbot-${VERSION}"
          {
            echo "app_version=$VERSION"
            echo "image_tag=$TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push with shared Harbor action
        uses: VEVO/github-tools/.github/actions/build-docker-app-image@master
        with:
          harbor_username: ${{ secrets.HARBOR_USERNAME }}
          harbor_password: ${{ secrets.HARBOR_PASSWORD }}
          image_name: incidentbot
          image_tag: ${{ steps.version.outputs.image_tag }}
          build_args: |
            APP_VERSION=${{ steps.version.outputs.app_version }}

      - name: Record published image
        env:
          IMAGE_TAG: ${{ steps.version.outputs.image_tag }}
        run: |
          IMAGE="harbor.vevomgmt.com/vevo/incidentbot:${IMAGE_TAG}"
          docker buildx imagetools inspect "$IMAGE"
          printf 'Image: %s\n\nSource commit: %s\n' "$IMAGE" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  # ── Release ───────────────────────────────────────────────────────────────────
  # Runs only on CalVer tag pushes. Creates a GitHub Release with auto-generated
  # notes (pulls in merged PRs and commits since the previous release).
  release:
    name: Release
    needs: [build-and-push]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v6

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --verify-tag
